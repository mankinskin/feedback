[package]
name = "feedback-api"
version = "0.1.0"
edition = "2024"
description = "Feedback system: normalized feedback events, summaries, and file-backed persistence"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[dev-dependencies]
tempfile = "3"
