[package]
name = "feedback-cli"
version = "0.1.0"
edition = "2024"
description = "CLI for feedback-api: ingest, inbox query, summary, and transcript mining"

[[bin]]
name = "feedback"
path = "src/main.rs"

[dependencies]
feedback-api = { path = "../feedback-api" }
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
